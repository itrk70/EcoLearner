<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoLearner - My Profile</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/notifications.css" />
</head>
<body>

  <div class="profile-page">

    <!-- ======================= HEADER ======================= -->
    <div class="profile-header">
      <div class="profile-header__left">
        <button class="profile-header__back" id="profileBackBtn" aria-label="Go back">
          <img src="../assets/icons/ui/arrow-left.svg" alt="" class="icon icon-white" />
        </button>
        <div>
          <div class="profile-header__title">My Profile 🌿</div>
          <div class="profile-header__tagline">Learn today, protect tomorrow.</div>
        </div>
      </div>

      <div class="profile-header__right">
        <!-- Notification bell + popover. This wrapper div (not the button
             itself) is what notif-popover.css positions relative to -
             a <button> can't legally contain another <button>, so the
             popover has to be a sibling of profileNotifBtn, not a child. -->
        <div class="notif-anchor">
          <button class="profile-notif-btn" id="profileNotifBtn" aria-label="Notifications">
            <img src="../assets/icons/ui/bell.svg" alt="" class="icon" />
            <!-- Hidden by default (see .profile-notif-badge in profile.css) -
                 notifications.js adds "is-active" and sets the real count. -->
            <span class="profile-notif-badge" id="notifBadgeCount">0</span>
          </button>

          <!-- ======================= NOTIFICATION POPOVER =======================
               Anchored dropdown, NOT a centered modal (unlike the Forgot
               Password overlay on the login page). Opens directly below
               the bell button. Built + controlled by notifications.js.
          ========================================================================= -->
          <div class="notif-popover" id="notifPopover">
            <div class="notif-popover__header">
              <span class="notif-popover__title">Notifications</span>
              <button type="button" class="notif-popover__mark-all" id="notifMarkAllBtn">Mark all as read</button>
            </div>
            <div class="notif-popover__list" id="notifList">
              <!-- Filled by notifications.js on page load -->
            </div>
          </div>
        </div>

        <div class="profile-coin-pill">
          <img src="../assets/icons/ui/coin.svg" alt="" class="icon" />
          <span id="profileCoinValue">100</span>
        </div>
      </div>
    </div>

    <!-- ======================= BANNER CARD ======================= -->
    <div class="profile-banner">
      <img src="../assets/images/illustrations/profile-banner-background.png" alt="" class="profile-banner__bg" />

      <div class="profile-banner__content">
        <div class="profile-avatar-wrap">
          <img src="../assets/images/avatars/avatar-default.svg" alt="Profile picture" class="profile-avatar" />
          <button class="profile-avatar__edit-btn" id="editAvatarBtn" aria-label="Change profile picture">
            <img src="../assets/icons/ui/pencil.svg" alt="" class="icon icon-white" />
          </button>
        </div>

        <div class="profile-info">
          <div class="profile-info__name" id="profileName">Aarav 🌿</div>
          <div class="profile-info__title" id="profileTitle">Just Getting Started</div>

          <div class="profile-badge-level-row">
            <div class="profile-latest-badge" id="profileLatestBadge"></div>
            <div class="profile-level-pill">
              <img src="../assets/icons/ui/medal.svg" alt="" class="icon icon-white" />
              Level <span id="profileLevelValue">0</span>
            </div>
          </div>

          <div class="profile-xp-text" id="profileXpText">0 / 100 XP</div>
          <div class="profile-xp-bar">
            <div class="profile-xp-bar__fill" id="profileXpBarFill" style="width: 0%;"></div>
          </div>

          <div class="profile-country-row">
            <img src="../assets/icons/ui/globe.svg" alt="" class="icon" />
            <span id="profileCountry">🇮🇳 India</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ======================= STATS GRID ======================= -->
    <div class="profile-stats-grid">
      <div class="profile-stat-card">
        <img src="../assets/icons/ui/coin.svg" alt="" class="icon" style="color: var(--color-accent-gold);" />
        <div>
          <span class="profile-stat-card__value" id="statCoins">0</span>
          <span class="profile-stat-card__label">Coins</span>
        </div>
      </div>

      <div class="profile-stat-card">
        <img src="../assets/icons/ui/badge.svg" alt="" class="icon" />
        <div>
          <span class="profile-stat-card__value" id="statBadges">0</span>
          <span class="profile-stat-card__label">Badges</span>
        </div>
      </div>

      <div class="profile-stat-card">
        <img src="../assets/icons/ui/quiz-symbol.svg" alt="" class="icon" />
        <div>
          <span class="profile-stat-card__value" id="statQuizzes">0</span>
          <span class="profile-stat-card__label">Quizzes</span>
        </div>
      </div>

      <div class="profile-stat-card">
        <img src="../assets/icons/ui/streak-fire.svg" alt="" class="icon" />
        <div>
          <span class="profile-stat-card__value" id="statStreak">0</span>
          <span class="profile-stat-card__label">Day Streak</span>
        </div>
      </div>
    </div>

    <!-- ======================= ACHIEVEMENTS + RECENT ACTIVITY ======================= -->
    <div class="profile-columns">

      <div class="profile-panel">
        <div class="profile-panel__header">
          <div class="profile-panel__title">
            <img src="../assets/icons/ui/leaf.svg" alt="" class="icon" />
            Achievements
          </div>
          <a href="achievements.html" class="profile-panel__view-all">View All &rsaquo;</a>
        </div>
        <div id="achievementsList"><!-- filled by profile.js --></div>
      </div>

      <div class="profile-panel">
        <div class="profile-panel__header">
          <div class="profile-panel__title">Recent Activity</div>
          <!-- No "View All" here on purpose - per project notes, that
               button in the original mockup was a mistake and is
               intentionally left out. -->
        </div>
        <div id="activityList"><!-- filled by profile.js --></div>
      </div>

    </div>

    <!-- ======================= BOTTOM BANNER (random message + typing effect) ======================= -->
    <div class="profile-bottom-banner">
      <img src="../assets/images/illustrations/profile-bottom-banner.png" alt="" class="profile-bottom-banner__bg" />
      <img src="../assets/images/illustrations/profile-hand-plant.png" alt="" class="profile-bottom-banner__hand" />
      <div class="profile-bottom-banner__text">
        <div class="profile-bottom-banner__heading" id="bottomBannerHeading"></div>
        <div class="profile-bottom-banner__subheading" id="bottomBannerSubheading"></div>
      </div>
    </div>

  </div>

  <!-- levels.js MUST load before profile.js - profile.js uses its functions -->
  <script src="../js/levels.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/notifications.js"></script>
</body>
</html>
